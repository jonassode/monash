<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monash - Test Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
        }

        #gameContainer {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        #canvasContainer {
            flex: 1;
            position: relative;
        }

        #gameCanvas {
            display: block;
            background: #2a2a2a;
        }

        #uiPanel {
            width: 300px;
            background: #0a0a0a;
            overflow-y: auto;
            border-left: 2px solid #333;
        }

        button {
            cursor: pointer;
            background: #444;
            color: #fff;
            border: 1px solid #666;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 12px;
        }

        button:hover {
            background: #555;
        }

        button:active {
            background: #333;
        }

        h2, h3, h4 {
            margin: 10px 0 5px 0;
        }

        hr {
            margin: 10px 0;
            border: none;
            border-top: 1px solid #333;
        }

        p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="canvasContainer">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div id="uiPanel">
            <div style="padding: 10px;">
                <p>Loading...</p>
            </div>
        </div>
    </div>

    <script type="module" src="src/game.js"></script>
</body>
</html>
